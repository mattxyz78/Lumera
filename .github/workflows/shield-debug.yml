name: Shield debug build (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lumera
        uses: actions/checkout@v4
        with:
          path: Lumera
      - name: Checkout subtitle renderer
        uses: actions/checkout@v4
        with:
          repository: LumeraD3v/assrender
          path: assrender
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build debug APK
        working-directory: Lumera
        run: bash ./gradlew :app:assembleDebug --no-daemon
      - name: Save debug APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumera-shield-debug
          path: Lumera/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
