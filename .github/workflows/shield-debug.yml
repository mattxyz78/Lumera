name: Cinevo / Shield debug build
# Rebuild with persistent Cinevo signing secrets
# Retry after correcting keystore Base64 secret
# Recheck after copy-only Base64 secret replacement
# Retry after correcting signing key password

on:
  workflow_dispatch:
  push:
    branches:
      - development/cinevo-branding
      - fix/cinevo-profile-isolation-v0.2.1

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lumera
        uses: actions/checkout@v4
        with:
          path: Lumera
      - name: Checkout subtitle renderer
        uses: actions/checkout@v4
        with:
          repository: LumeraD3v/assrender
          path: assrender
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Configure persistent Cinevo signing
        env:
          CINEVO_KEYSTORE_BASE64: ${{ secrets.CINEVO_KEYSTORE_BASE64 }}
          CINEVO_KEYSTORE_PASSWORD: ${{ secrets.CINEVO_KEYSTORE_PASSWORD }}
          CINEVO_KEY_ALIAS: ${{ secrets.CINEVO_KEY_ALIAS }}
          CINEVO_KEY_PASSWORD: ${{ secrets.CINEVO_KEY_PASSWORD }}
        run: |
          if [[ -z "$CINEVO_KEYSTORE_BASE64" || -z "$CINEVO_KEYSTORE_PASSWORD" || -z "$CINEVO_KEY_ALIAS" || -z "$CINEVO_KEY_PASSWORD" ]]; then
            echo "::error::Cinevo signing secrets are missing. Refusing to publish another incompatible debug APK."
            exit 1
          fi
          # Accept wrapped Base64 and accidental NAME= prefix without logging the secret.
          clean_value="$(printf '%s' "$CINEVO_KEYSTORE_BASE64" | sed 's/^CINEVO_KEYSTORE_BASE64=//' | tr -d '[:space:]')"
          if ! printf '%s' "$clean_value" | base64 --decode > "$RUNNER_TEMP/cinevo-test-signing.jks"; then
            echo "::error::Signing key Base64 is incomplete or malformed. Recopy the complete value from the private backup."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/cinevo-test-signing.jks" -storepass "$CINEVO_KEYSTORE_PASSWORD" -alias "$CINEVO_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Signing keystore or its password/alias is invalid. Check the four secrets against the private backup."
            exit 1
          fi
          echo "CINEVO_KEYSTORE_PATH=$RUNNER_TEMP/cinevo-test-signing.jks" >> "$GITHUB_ENV"
      - name: Build debug APK
        working-directory: Lumera
        env:
          CINEVO_KEYSTORE_PASSWORD: ${{ secrets.CINEVO_KEYSTORE_PASSWORD }}
          CINEVO_KEY_ALIAS: ${{ secrets.CINEVO_KEY_ALIAS }}
          CINEVO_KEY_PASSWORD: ${{ secrets.CINEVO_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleDebug --no-daemon
      - name: Save debug APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinevo-shield-debug
          path: Lumera/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
